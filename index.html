<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TimeUp – Appointment booking prototype</title>
  <meta name="description" content="Clickable prototype of TimeUp, an appointment-booking plug-in for personal care businesses.">
  <link rel="icon" href="assets/timeup-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="assets/timeup-icon.png" alt="">
      <span>TimeUp</span>
      <small>Prototype</small>
    </div>
    <nav class="tabs" aria-label="Prototype screens">
      <button class="tab" data-view="booking">Client booking</button>
      <button class="tab" data-view="messages">Reminders &amp; follow-up</button>
      <button class="tab" data-view="dashboard">Business dashboard</button>
    </nav>
  </header>

  <main id="app"></main>

  <script src="js/utils.js"></script>
  <script src="js/booking.js"></script>
  <script src="js/messages.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
